name: Extract All URLs from APK

on:
  workflow_dispatch:

jobs:
  extract-urls:
    runs-on: ubuntu-latest
    steps:
      - name: Install Apktool
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool

      - name: Download APK from Hostinger
        run: wget "https://panel.egysat.net/egyplayer.apk" -O app.apk

      - name: Decompile APK
        run: apktool d app.apk -o decoded_apk

      - name: Extract URLs
        run: |
          echo "جاري استخراج جميع الروابط من ملفات التطبيق..."
          grep -hroE 'https?://[^"'\''\\ >]+' decoded_apk | sort -u > extracted_urls.txt
          echo "تم العثور على $(wc -l < extracted_urls.txt) رابط."

      - name: Upload URLs Text File
        uses: actions/upload-artifact@v4
        with:
          name: APK_Extracted_URLs
          path: extracted_urls.txt
